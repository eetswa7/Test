<!doctype html><html lang="en"><meta charset="utf-8"><title>Breachline device layout checks</title><style>body{background:#24302a;color:#e7f5dc;font:14px Arial;margin:24px}button{padding:10px 14px;background:#dcff80;border:0;margin-right:8px;cursor:pointer}iframe{display:block;border:1px solid #7f9570;margin-top:20px;background:#112016}p{color:#bdcbb5}</style><h1>Device layout checks</h1><button data-size="844,390">iPhone landscape 844 × 390</button><button data-size="667,375">Small landscape 667 × 375</button><button data-size="932,430">Large landscape 932 × 430</button><button data-size="390,844">Portrait 390 × 844</button><p>Uses the real game in a constrained viewport with touch controls. No simulated game state.</p><iframe title="iPhone viewport" width="844" height="390" src="/?controls=touch"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h;};</script></html>
